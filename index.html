<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./opencode-mobile-client-logo-light.svg"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="./opencode-mobile-client-logo-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>OpenCode Mobile &lt;Client&gt;</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-error" style="display:none; position:fixed; inset:0; z-index:999999; background:#000; color:#ff5555; padding:20px; font-family:monospace; overflow:auto;">
      <h2>⚠️ Boot Error Captured</h2>
      <pre id="boot-error-text"></pre>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.getElementById('boot-error');
        var errText = document.getElementById('boot-error-text');
        if (errDiv && errText) {
          errDiv.style.display = 'block';
          errText.textContent += e.message + ' at ' + e.filename + ':' + e.lineno + '\n';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.getElementById('boot-error');
        var errText = document.getElementById('boot-error-text');
        if (errDiv && errText) {
          errDiv.style.display = 'block';
          errText.textContent += 'Unhandled Promise: ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'Unknown') + '\n';
        }
      });
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
